server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      idle-timeout: 15000
      pool-name: NexusProdHikariPool
      max-lifetime: 600000
      connection-timeout: 10000
      data-source-properties:
        prepareThreshold: 0
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  thymeleaf:
    cache: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    uz.axm.nexus: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  storage:
    provider: ${STORAGE_PROVIDER:neon}
    s3:
      endpoint: ${AWS_ENDPOINT_URL_S3:https://br-dark-math-beyvvxd8.storage.c-9.us-east-2.aws.neon.tech}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      region: ${AWS_REGION:us-east-2}
      bucket: ${S3_BUCKET_NAME:${AWS_S3_BUCKET:assets}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://axm-nexus.uz,https://www.axm-nexus.uz}
  seeder:
    demo-data-enabled: ${APP_SEEDER_DEMO_DATA_ENABLED:false}
  security:
    allow-public-registration: ${ALLOW_PUBLIC_REGISTRATION:false}
    captcha-required: ${CAPTCHA_REQUIRED:false}
    superadmin-bootstrap:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${SUPER_ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:}
      email: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:admin@axm-nexus.uz}
      full-name: ${SUPER_ADMIN_BOOTSTRAP_FULL_NAME:Tizim Super Administratori}
