server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 15000
      pool-name: NexusProdHikariPool
      max-lifetime: 600000
      connection-timeout: 10000
      data-source-properties:
        prepareThreshold: 0
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  thymeleaf:
    cache: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    uz.axm.nexus: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yangiariq-aqua.onrender.com}
  seeder:
    demo-data-enabled: ${APP_SEEDER_DEMO_DATA_ENABLED:false}
  security:
    allow-public-registration: false
    captcha-required: true
    superadmin-bootstrap:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
