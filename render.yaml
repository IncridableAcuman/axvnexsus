# ==============================================================================
# Render Infrastructure Blueprint — AXV Nexus / YANGIARIQ AQUA AI
# Services:
#   1. Backend Web Service: yangiariq-aqua-api (Spring Boot 4 / Java 21 / Docker)
#   2. Frontend Static Site: yangiariq-aqua (React 19 / Vite / Tailwind v4)
# Database & Storage:
#   - Database: Neon Serverless PostgreSQL (Pooled connection, PgBouncer compatible)
#   - Storage: Neon S3-Compatible Object Storage (Neon Files / Bucket: assets)
# Caching (Redis):
#   - Loyiha to'liq holatsiz (stateless) arxitekturada qurilgan va tranzaksion
#     keshlash PostgreSQL/HikariCP orqali optimal ta'minlanadi.
#   - Backend kod bazasida Redis bog'liqligi talab etilmaganligi sababli, ortiqcha
#     resurs sarfini va Render bepul limitlarini tejash maqsadida Redis olib tashlangan.
#   - Kelajakda Redis talab etilsa, fayl oxiridagi `keyvalue` bloki orqali faollashtirish mumkin.
# ==============================================================================

services:
  # ============================================================================
  # Backend Web Service
  # ============================================================================
  - type: web
    name: yangiariq-aqua-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ------------------------------------------------------------------------
      # Database Configuration (Neon PostgreSQL)
      # Yagona NEON_URL kiritish kifoya. Tizim avtomatik ravishda barcha kerakli
      # parametrlarni (host, port, user, password, ssl, pooler) ajratib oladi.
      # ------------------------------------------------------------------------
      - key: NEON_URL
        sync: false

      # ------------------------------------------------------------------------
      # Object Storage Configuration (Neon S3 Storage / Neon Files)
      # ------------------------------------------------------------------------
      - key: STORAGE_PROVIDER
        value: neon
      - key: AWS_ENDPOINT_URL_S3
        value: https://br-dark-math-beyvvxd8.storage.c-9.us-east-2.aws.neon.tech
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET_NAME
        value: assets

      # ------------------------------------------------------------------------
      # Security & JWT Configuration
      # ------------------------------------------------------------------------
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://yangiariq-aqua-3zrr.onrender.com,https://yangiariq-aqua.onrender.com,https://*.onrender.com
      - key: APP_BASE_URL
        value: https://yangiariq-aqua-3zrr.onrender.com

      # ------------------------------------------------------------------------
      # SuperAdmin Provisioning (Bootstrap o'chirilgan, faollashtirish shart emas)
      # ------------------------------------------------------------------------
      - key: SUPER_ADMIN_BOOTSTRAP_ENABLED
        value: "false"

      # ------------------------------------------------------------------------
      # Application Controls
      # ------------------------------------------------------------------------
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: CAPTCHA_REQUIRED
        value: "false"
      - key: APP_SEEDER_DEMO_DATA_ENABLED
        value: "false"

      # ------------------------------------------------------------------------
      # Async Services (RabbitMQ & Mail)
      # Safely disabled on Render free web service by default
      # ------------------------------------------------------------------------
      - key: RABBITMQ_AUTO_STARTUP
        value: "false"
      - key: MAIL_ENABLED
        value: "false"

      # ------------------------------------------------------------------------
      # AI Provider (Groq / Gemini)
      # ------------------------------------------------------------------------
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

  # ============================================================================
  # Frontend Static Site
  # ============================================================================
  - type: web
    name: yangiariq-aqua
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://yangiariq-aqua-api.onrender.com/api

  # ============================================================================
  # Optional Redis / Key-Value Instance (Kelajakda kesh kerak bo'lsa faollashtiring)
  # ============================================================================
  # - type: keyvalue
  #   name: yangiariq-aqua-redis
  #   plan: free
  #   ipAllowList: [] # Faqat Render ichki tarmog'iga ulanishga ruxsat
