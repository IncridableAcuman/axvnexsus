services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axvhub}
      POSTGRES_USER: ${POSTGRES_USER:-axm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axm_admin} -d ${POSTGRES_DB:-axvhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexus-prod-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-prod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexus_mq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password required}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexus-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: axm-nexus-backend:latest
    container_name: nexus-prod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-axvhub}
      DB_USER: ${POSTGRES_USER:-axm_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-3}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-nexus_mq_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?JWT secret key required}
      APP_BASE_URL: ${APP_BASE_URL:-https://axm-nexus.uz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://axm-nexus.uz,https://www.axm-nexus.uz}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      CAPTCHA_REQUIRED: ${CAPTCHA_REQUIRED:-false}
      SUPER_ADMIN_BOOTSTRAP_ENABLED: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:-false}
      SUPER_ADMIN_BOOTSTRAP_USERNAME: ${SUPER_ADMIN_BOOTSTRAP_USERNAME:-admin}
      SUPER_ADMIN_BOOTSTRAP_PASSWORD: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:-}
      SUPER_ADMIN_BOOTSTRAP_EMAIL: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:-admin@axm-nexus.uz}
      SUPER_ADMIN_BOOTSTRAP_FULL_NAME: ${SUPER_ADMIN_BOOTSTRAP_FULL_NAME:-Tizim Super Administratori}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@axm-nexus.uz}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "7"
    networks:
      - nexus-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: axm-nexus-frontend:latest
    container_name: nexus-prod-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexus-prod-network

volumes:
  postgres_prod_data:
  rabbitmq_prod_data:
  backend_uploads:

networks:
  nexus-prod-network:
    driver: bridge
