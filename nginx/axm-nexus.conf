# ==============================================================================
# AXM Nexus — Real Server Nginx Reverse Proxy & SSL Configuration
# Joylashuvi: /etc/nginx/sites-available/axm-nexus.conf
# ==============================================================================

# Rate limiting zonalari: Botlar va Brute-Force hujumlaridan himoya
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=auth_login_limit:10m rate=5r/m;

# 1. HTTP -> HTTPS Avtomatik Yo'naltirish (301 Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name axm-nexus.uz www.axm-nexus.uz;

    # Let's Encrypt Certbot ACME Challenge tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Asosiy HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axm-nexus.uz www.axm-nexus.uz;

    # SSL / TLS Sertifikatlari (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/axm-nexus.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axm-nexus.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/axm-nexus.uz/chain.pem;

    # Zamonaviy va xavfsiz TLS protokollari (TLSv1.2 va TLSv1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # SSL Sessiya Keshlash
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (SSL tezligi va ishonchliligi)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Xavfsizlik Sarlavhalari (Production Security Headers)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fayl yuklash maksimal hajmi (Backend bilan 50MB moslashtirilgan)
    client_max_body_size 50M;

    # Gzip Siqish Sozlamalari
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Kirish loglari
    access_log /var/log/nginx/axm-nexus.access.log;
    error_log /var/log/nginx/axm-nexus.error.log warn;

    # Liveness & Readiness probe
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth login so'rovlarini cheklash (Brute-force protection)
    location ~* ^/api/(v[0-9]+/)?auth/login {
        limit_req zone=auth_login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Asosiy trafikni Docker Frontend (va u orqali Backend) ga yo'naltirish
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080; # yoki .env da HTTP_PORT qaysi portga ulangan bo'lsa
        proxy_http_version 1.1;

        # WebSocket qo'llab-quvvatlash
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Standart proksi sarlavhalari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Katta JWT tokenlar va sarlavhalar buferi
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Katta so'rovlar / AI javoblari uchun taymoutlar
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
